name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          # Config pública del SDK web de Firebase (no es secreta: la
          # seguridad real la dan las reglas de Firestore/Auth, no este
          # valor). Si cambias de proyecto de Firebase, actualiza estos.
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyAnx8TnvPeFp4pyZLMh11pC5BUfhJXDBBQ"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "code-reset.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "code-reset"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "code-reset.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "273971106244"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:273971106244:web:370cf3e4e2da1d6a93d491"
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
